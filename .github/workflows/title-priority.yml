name: Structural title priority

on:
  pull_request:
  push:
    branches: ['fm/**']

permissions:
  contents: read

jobs:
  title-priority:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: transpect/xslt-util
          ref: 5d78dff50bf197e7973c5dcf92b921e08c4ae6cc
          path: .test-deps/xslt-util
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.18'
      - run: python -m pip install -r tests/requirements.txt
      - name: Check conversion and pristine negative control
        shell: bash
        run: |
          baseline="$RUNNER_TEMP/hub2html-baseline"
          mkdir -p "$baseline"
          git archive ee25fb16ce4819ef6ab880889e9761d8e5768ef3 | tar -x -C "$baseline"
          python tests/title_priority.py --xslt-util .test-deps/xslt-util --baseline-root "$baseline"
